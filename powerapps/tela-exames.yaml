      Font: =Font.'Segoe UI'
      Color: =RGBA(26, 35, 126, 1)
      X: =40
      Y: =20
      Width: =800
      Height: =44
      Text: ="Transcritor de Exames"
      Size: =22
      FontWeight: =FontWeight.Semibold
- Subtitulo:
    Control: Label@2.5.1
    Properties:
      Font: =Font.'Segoe UI'
      Color: =RGBA(136, 136, 136, 1)
      X: =40
      Y: =62
      Width: =1000
      Height: =24
      Text: ="Transcrição de exames do Laudo Individual do AGHU"
      Size: =11
- RotuloEntrada:
    Control: Label@2.5.1
    Properties:
      Font: =Font.'Segoe UI'
